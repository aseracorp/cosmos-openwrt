name: "on push: Build & Publish OpenWrt Image"

on:
  workflow_dispatch:
  push:
    branches: [ "master", "unstable" ]

env:
  SSH_KEY: ${{ secrets.SSH_KEY }}
  owrt_version: ''
  cosmos_version: 'latest'
  packages: 'luci-i18n-base-de luci-i18n-base-fr luci-i18n-base-it zoneinfo-core zoneinfo-europe luci luci-ssl fdisk mount-utils kmod-fs-btrfs btrfs-progs block-mount chattr docker dockerd luci-app-dockerman luci-app-uhttpd kmod-usb-acm avahi-daemon bash yq lsblk avahi-utils watchcat luci-app-watchcat fuse3-utils rclone samba4-server wsdd2 usbutils kmod-usb-net-qmi-wwan uqmi luci-proto-qmi kmod-usb-serial-option mwan3 luci-app-mwan3 ntfs-3g shadow-su sudo kmod-usb-serial-ftdi partx-utils kmod-lib-lz4 zram-swap curl grep coreutils-timeout ethtool findutils-xargs coreutils-df snapraid mergerfs luci-theme-footstrap'
  files: 'files'
  rootfs_partsize: '896'
  storage: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: free up space on gh runner (otherwise it'll run out of space)
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: false #~1G
          remove_dotnet: false #~5G
          remove_haskell: true #~4G
          remove_tool_cache: false #~5G
          remove_swap: true #~3G
          rm_cmd: "rmz"
          #remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*" #~7G
          remove_folders: "/usr/share/swift" #~3.3G
          #remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/aws-cli /usr/local/aws-sam-cli #~7G

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: install deps
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: awk file build-essential file libncurses-dev zlib1g-dev gawk git gettext libssl-dev xsltproc rsync wget unzip python3 python3-setuptools zstd curl tar gcc make gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu jq musl-tools 
          version: 1.0
          
      - name: add env-vars & secrets
        run: |
          mkdir -p ${{ env.files }}/etc/cosmos
          echo "STORAGE=${{ env.storage }}" >> ${{ env.files }}/etc/cosmos/.env
          echo 'SSH_KEY="${{ secrets.SSH_KEY }}"' >> ${{ env.files }}/etc/cosmos/.env
          ### copy folder to arm64
          cp -R ${{ env.files }} ${{ env.files }}-arm64

      - name: resolve OpenWrt version
        run: |
          OWRT_VERSION="${{ env.owrt_version }}"
          if [ -z "${OWRT_VERSION}" ]; then
            echo "No OpenWrt version specified, fetching latest release..."
            OWRT_VERSION=$(curl -s https://downloads.openwrt.org/releases/ | grep -oE 'href="[0-9]+\.[0-9]+\.[0-9]+/"' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -n1)
          fi
          echo "owrt_version=${OWRT_VERSION}" >> "$GITHUB_ENV"
          echo "Using OpenWrt version: ${OWRT_VERSION}"

      - parallel:
        - name: Download for bcm27xx-bcm2711
          run: | 
            mkdir -p openwrt/bcm27xx-bcm2711 && cd openwrt/bcm27xx-bcm2711
            if [ "${{ env.owrt_version }}" = "snapshots" ]; then
              curl -L "https://downloads.openwrt.org/snapshots/targets/bcm27xx/bcm2711/openwrt-imagebuilder-bcm27xx-bcm2711.Linux-x86_64.tar.zst" -o "openwrt-imagebuilder-bcm27xx-bcm2711.Linux-x86_64.tar.zst"
              curl -L "https://downloads.openwrt.org/snapshots/targets/bcm27xx/bcm2711/sha256sums" -o sha256sums
            else
              curl -L "https://downloads.openwrt.org/releases/${{ env.owrt_version }}/targets/bcm27xx/bcm2711/openwrt-imagebuilder-${{ env.owrt_version }}-bcm27xx-bcm2711.Linux-x86_64.tar.zst" -o "openwrt-imagebuilder-${{ env.owrt_version }}-bcm27xx-bcm2711.Linux-x86_64.tar.zst"
              curl -L "https://downloads.openwrt.org/releases/${{ env.owrt_version }}/targets/bcm27xx/bcm2711/sha256sums" -o sha256sums
            fi
            sha256sum --check --ignore-missing sha256sums
            tar --zstd -x -f openwrt-imagebuilder*-bcm27xx-bcm2711*
            rm openwrt-imagebuilder-*.tar.zst && rm sha256sums
            rm -Rf imagebuilder-bcm27xx-bcm2711/
            mv openwrt-imagebuilder*-bcm27xx-bcm2711* ../imagebuilder-bcm27xx-bcm2711

        - name: Download for x86-64
          run: | 
            mkdir -p openwrt/x86-64 && cd openwrt/x86-64
            if [ "${{ env.owrt_version }}" = "snapshots" ]; then
              curl -L "https://downloads.openwrt.org/snapshots/targets/x86/64/openwrt-imagebuilder-x86-64.Linux-x86_64.tar.zst" -o "openwrt-imagebuilder-x86-64.Linux-x86_64.tar.zst"
              curl -L "https://downloads.openwrt.org/snapshots/targets/x86/64/sha256sums" -o sha256sums
            else
              curl -L "https://downloads.openwrt.org/releases/${{ env.owrt_version }}/targets/x86/64/openwrt-imagebuilder-${{ env.owrt_version }}-x86-64.Linux-x86_64.tar.zst" -o "openwrt-imagebuilder-${{ env.owrt_version }}-x86-64.Linux-x86_64.tar.zst"
              curl -L "https://downloads.openwrt.org/releases/${{ env.owrt_version }}/targets/x86/64/sha256sums" -o sha256sums
            fi
            sha256sum --check --ignore-missing sha256sums
            tar --zstd -x -f openwrt-imagebuilder*-x86-64*
            rm openwrt-imagebuilder-*.tar.zst && rm sha256sums
            rm -Rf imagebuilder-x86-64/
            mv openwrt-imagebuilder*-x86-64* ../imagebuilder-x86-64

      - name: get Cosmos Version
        run: |
          if [ "${{ env.cosmos_version }}" = "latest" ] ; then
            cosmos_version=$(curl -s https://api.github.com/repos/azukaar/Cosmos-Server/releases/latest | grep "tag_name" | cut -d '"' -f 4)
          elif [ "${{ env.cosmos_version }}" = "unstable" ] ; then
            cosmos_version=$(jq -r 'map(select(.prerelease)) | first | .tag_name' <<< $(curl -s https://api.github.com/repos/azukaar/Cosmos-Server/releases))
          else
            cosmos_version="${{ env.cosmos_version }}"
          fi
          echo "cosmos_version=${cosmos_version}" >> "$GITHUB_ENV"

      - name: cache Cosmos Cloud
        id: cache-cosmosCloud
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.files }}/opt/cosmos/
            ${{ env.files }}-arm64/opt/cosmos/
          key: automatic-cosmosCloud-${{ env.cosmos_version }}

      - parallel:
        - name: install Cosmos Cloud amd64
          if: steps.cache-cosmosCloud.outputs.cache-hit != 'true'
          run: |
            echo "INSTALLING COSMOS CLOUD..."
            rm -Rf ${{ env.files }}/opt/cosmos/
            mkdir -p ${{ env.files }}/opt/cosmos
            echo "Downloading Cosmos release $RELEASE..."
            RELEASE=${{ env.cosmos_version }}
            ZIP_FILEamd64="cosmos-cloud-${RELEASE#v}-amd64.zip" 
            curl -L "https://github.com/aseracorp/Cosmos-Server/releases/download/${RELEASE}/${ZIP_FILEamd64}" -o "${ZIP_FILEamd64}"
            curl -L "https://github.com/aseracorp/Cosmos-Server/releases/download/${RELEASE}/${ZIP_FILEamd64}.md5" -o "${ZIP_FILEamd64}.md5"
            echo "Verifying MD5 checksum..."
            md5sum -c "${ZIP_FILEamd64}.md5"
            echo "Extracting files..."
            unzip -o "${ZIP_FILEamd64}"
            mv cosmos-cloud-${RELEASE#v}/* ${{ env.files }}/opt/cosmos/
        - name: install Cosmos Cloud arm64
          if: steps.cache-cosmosCloud.outputs.cache-hit != 'true'
          run: |
            echo "INSTALLING COSMOS CLOUD..."
            rm -Rf ${{ env.files }}-arm64/opt/cosmos/
            mkdir -p ${{ env.files }}-arm64/opt/cosmos
            echo "Downloading Cosmos release $RELEASE..."
            RELEASE=${{ env.cosmos_version }}
            ZIP_FILEarm64="cosmos-cloud-${RELEASE#v}-arm64.zip"
            curl -L "https://github.com/aseracorp/Cosmos-Server/releases/download/${RELEASE}/${ZIP_FILEarm64}" -o "${ZIP_FILEarm64}"
            curl -L "https://github.com/aseracorp/Cosmos-Server/releases/download/${RELEASE}/${ZIP_FILEarm64}.md5" -o "${ZIP_FILEarm64}.md5"
            echo "Verifying MD5 checksum..."
            md5sum -c "${ZIP_FILEarm64}.md5"
            echo "Extracting files..."
            unzip -o "${ZIP_FILEarm64}"
            mv cosmos-cloud-${RELEASE#v}-arm64/* ${{ env.files }}-arm64/opt/cosmos/

      - name: add custom files
        run: |
          chmod -R 755 ${{ env.files }}
          chmod -R 755 ${{ env.files }}-arm64
          cp -R ${{ env.files }} openwrt/imagebuilder-x86-64/${{ env.files }}
          cp -R ${{ env.files }}-arm64 openwrt/imagebuilder-bcm27xx-bcm2711/${{ env.files }}

      - name: configure Cosmos Cloud, SnapRAID & mergerfs apk feed in imagebuilders
        run: |
          set -euo pipefail
          FEED_BASE="https://aseracorp.github.io/openwrt-packages"
          KEY_ID="aede713bafd53a86"
          # Register the unified Cosmos Cloud feed (snapraid + mergerfs + cosmoscloud) +
          # trust key in each imagebuilder so the `snapraid` / `mergerfs` packages
          # resolve via PACKAGES during `make image`.
          # (Flat apk repo: just append the packages.adb URL to the imagebuilder's
          # 'repositories' file and drop the pub key into its keys/ dir.)
          config_feed() {
            local ib="$1" arch="$2"
            local dir="openwrt/$ib"
            if [ ! -f "$dir/repositories" ]; then
              echo "::warning::cosmos feed skipped for $ib (needs apk imagebuilder 25.1+)"
              return
            fi
            mkdir -p "$dir/keys"
            curl -fsSL "$FEED_BASE/$arch/$KEY_ID.pub" -o "$dir/keys/$KEY_ID.pub"
            if ! grep -q "$FEED_BASE/$arch/packages.adb" "$dir/repositories"; then
              echo "$FEED_BASE/$arch/packages.adb" >> "$dir/repositories"
            fi
            # Bake the repo + trust key into the runtime apk config so on-device
            # `apk update` / `apk upgrade snapraid mergerfs` can reach this feed. The
            # files overlay (make image FILES=...) is copied verbatim into the
            # rootfs, so writing under its etc/apk lands on the final image.
            local rt="openwrt/$ib/${{ env.files }}"
            mkdir -p "$rt/etc/apk/repositories.d" "$rt/etc/apk/keys"
            cp "$dir/keys/$KEY_ID.pub" "$rt/etc/apk/keys/$KEY_ID.pub"
            if ! grep -q "$FEED_BASE/$arch/packages.adb" "$rt/etc/apk/repositories.d/customfeeds.list" 2>/dev/null; then
              echo "$FEED_BASE/$arch/packages.adb" >> "$rt/etc/apk/repositories.d/customfeeds.list"
            fi
          }
          config_feed imagebuilder-x86-64 x86_64
          config_feed imagebuilder-bcm27xx-bcm2711 aarch64_cortex-a72

      - parallel:
        - name: build image RPI-4
          run: |
            cd openwrt/imagebuilder-bcm27xx-bcm2711
            make image PROFILE=rpi-4 PACKAGES="${{ env.packages }}" FILES="${{ env.files }}" ROOTFS_PARTSIZE="${{ env.rootfs_partsize }}" EXTRA_IMAGE_NAME="CosmosCloud-${{ env.cosmos_version }}" DISABLED_SERVICES="ttyd"

        - name: build image AMD64
          run: |
            cd openwrt/imagebuilder-x86-64
            make image PROFILE=generic PACKAGES="${{ env.packages }}" FILES="${{ env.files }}" ROOTFS_PARTSIZE="${{ env.rootfs_partsize }}" EXTRA_IMAGE_NAME="CosmosCloud-${{ env.cosmos_version }}" DISABLED_SERVICES="ttyd"

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "openwrt/imagebuilder-bcm27xx-bcm2711/bin/targets/bcm27xx/bcm2711/*squashfs*.img.gz, openwrt/imagebuilder-x86-64/bin/targets/x86/64/*squashfs-combined*.img.gz"
          tag: cc${{ env.cosmos_version }}-owv${{ env.owrt_version }}
          name: Cosmos Cloud ${{ env.cosmos_version }} OpenWrt ${{ env.owrt_version }}
          allowUpdates: true
          prerelease: ${{ env.owrt_version == 'snapshots' || contains(env.cosmos_version, 'unstable') }}
          makeLatest: ${{ env.owrt_version != 'snapshots' && !contains(env.cosmos_version, 'unstable') }}